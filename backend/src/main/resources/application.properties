spring.application.name=amity-clinic-api
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
server.servlet.session.timeout=30m

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

clinic.allowed-origins=${CLINIC_ALLOWED_ORIGINS:http://localhost:5173}
